<!DOCTYPE html>
<html>
<head>
    <title>Config Check</title>
</head>
<body>
    <h1>Configuration Check</h1>
    <p>This page will show in browser console what API URL is being used</p>
    <div id="info"></div>
    <script>
        // This won't work because env vars are build-time only
        console.log('Build-time API URL check - see network tab for actual requests');
        
        // Test the backend
        fetch('/api/listings')
            .then(r => r.json())
            .then(data => {
                document.getElementById('info').innerHTML = '<p style="color: green;">✅ Backend Connected! Found ' + data.length + ' listings</p>';
            })
            .catch(err => {
                document.getElementById('info').innerHTML = '<p style="color: red;">❌ Backend Error: ' + err.message + '</p>';
            });
    </script>
</body>
</html>
