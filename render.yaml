services:
  - type: web
    name: airbnb-backend
    env: node
    plan: free
    # Run the service from the `backend` subdirectory
    root: backend
    buildCommand: npm install
    startCommand: npm start
    # Do not commit secrets here. Set MONGODB_URI and JWT_SECRET in Render dashboard.
    envVars:
      - key: NODE_ENV
        value: production
